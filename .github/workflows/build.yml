name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: labatory
      POSTGRES_USER: labatory
      POSTGRES_PASSWORD: labatory_pw
      DATABASE_URL: postgresql://labatory:labatory_pw@db:5432/labatory?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: DB up
        run: npm run db:up

      - name: Wait for DB
        shell: bash
        run: |
          for i in {1..60}; do
            if docker compose exec -T db pg_isready >/dev/null 2>&1; then
              echo "DB is ready"; exit 0
            fi
            echo "Waiting for DB... ($i/60)"
            sleep 1
          done
          echo "DB not ready in time"
          docker compose logs db || true
          exit 1

      - name: Next up
        run: npm run next:up
        
      - name: Wait for next healthcheck
        shell: bash
        run: |
          for i in {1..30}; do
            health=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q next) 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              echo "next is healthy"
              exit 0
            fi
            echo "Waiting for next health... ($i/30)"
            sleep 1
          done
          echo "next did not become healthy"
          docker compose logs next || true
          exit 1
                
      - name: Prisma generate
        run: npm run prisma:generate 

      - name: Prisma migrate
        run : npm run prisma:migrate:deploy

      - name: Prisma build
        run: npm run prisma:build
    
      - name: Build
        run: npm run web:build

      - name: next down
        if: always()
        run: npm run next:down

      - name: DB down
        if: always()
        run: npm run db:down
